name: transaction preflight

on:
  pull_request:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: M2M Sentinel transaction preflight
        id: preflight
        uses: ./.github/actions/transaction-preflight
        with:
          api-key: ${{ secrets.M2M_SENTINEL_API_KEY }}
          chain-id: '8453'
          to: '0x1111111111111111111111111111111111111111'
          data: '0x40c10f19'
          value: '0x0'
