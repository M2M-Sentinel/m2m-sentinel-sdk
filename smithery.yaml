# Smithery MCP Server Configuration
# https://smithery.ai/docs/config

startCommand:
  type: stdio
  command: npx
  args:
    - -y
    - m2m-sentinel-sdk
  configSchema:
    type: object
    properties:
      M2M_SENTINEL_API_KEY:
        type: string
        title: M2M Sentinel API Key
        description: Optional API key for prepaid access. Protected calls may return structured 401, 402, 429, or 503 responses without authorized access.
        default: ""

configSchema:
  type: object
  properties:
